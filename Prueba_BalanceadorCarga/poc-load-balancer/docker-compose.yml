version: '3.8'

services:
  evaluacion1:
    build: .
    environment:
      - PORT=8081
    ports:
      - "8081:8081"

  evaluacion2:
    build: .
    environment:
      - PORT=8082
    ports:
      - "8082:8082"

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - evaluacion1
      - evaluacion2