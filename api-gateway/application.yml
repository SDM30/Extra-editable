server:
  port: 8080

app:
  jwt-secret: "dev-secret-change-in-production"   # mismo valor que JWT_SECRET del collab-service

spring:
  cloud:
    gateway:
      routes:

        # ── Ruta WebSocket al servicio colaborativo ──────────────────────────
        # El frontend conecta a ws://localhost:8080/collab
        # El gateway hace proxy hacia ws://localhost:1234
        - id: collab-websocket
          uri: ws://localhost:1234          # protocolo ws://, no http://
          predicates:
            - Path=/collab/**
          filters:
            - RewritePath=/collab/(?<segment>.*), /$\{segment}
            # El token viaja en el query param ?token=... que el frontend ya manda
            # El collab-service lo verifica internamente → el gateway no toca el JWT

        # ── Rutas HTTP normales al backend Spring Boot ───────────────────────
        - id: backend-api
          uri: http://localhost:8081
          predicates:
            - Path=/api/**
          filters:
            - JwtAuth          # filtro personalizado definido abajo

      # Habilitar proxy WebSocket explícitamente
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowedMethods: ["GET","POST","PUT","DELETE","OPTIONS"]
            allowedHeaders: ["*"]
            allowCredentials: true