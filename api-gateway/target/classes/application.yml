server:
  port: 8080

app:
  jwt-secret: ${JWT_SECRET:dev-secret-change-in-production}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            corsConfigurations:
              '[/**]':
                allowedOrigins: "http://localhost:4200"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                  - PATCH
                allowedHeaders: "*"
      routes:
        - id: backend-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/**
          # The JwtAuth filter will be applied programmatically or by referencing its name here if registered as a component
          filters:
            - JwtAuth

        - id: collab-service
          uri: ws://localhost:1234
          predicates:
            - Path=/collab/**
          filters:
            - RewritePath=/collab/(?<segment>.*), /$\{segment}

        - id: code-execution-service
          uri: http://localhost:8000
          predicates:
            - Path=/ejecutar/**
