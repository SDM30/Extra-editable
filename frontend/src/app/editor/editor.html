<app-header
  [theme]="theme"
  [themeOptions]="themeOptions"
  [language]="language"
  [languageOptions]="languageOptions"
  (themeChange)="theme = $event"
  (languageChange)="onLanguageChange($event)"
  (runCode)="ejecutarCodigo()"
>
</app-header>

<app-code-section
  [(value)]="value"
  [theme]="theme"
  [language]="language"
  [projectId]="projectId"
  [filePath]="'main'"
  [lspEnabled]="lspEnabled"
  [resultado]="resultado"
  [resultadoOk]="resultadoOk"
  [cargando]="cargando"
  [terminalHeight]="terminalHeight"
  (resizeStart)="startResize($event)"
  (inputSend)="enviarEntrada($event)"
>
</app-code-section>
