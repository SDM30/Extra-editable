<app-header
  [theme]="theme"
  [themeOptions]="themeOptions"
  [language]="language"
  [languageOptions]="languageOptions"
  (themeChange)="theme = $event"
  (languageChange)="language = $event"
  (runCode)="ejecutarCodigo()">
</app-header>

<app-code-section
  [(value)]="value"
  [language]="language"
  [theme]="theme"
  [resultado]="resultado"
  [resultadoOk]="resultadoOk"
  [cargando]="cargando"
  (inputSend)="enviarEntrada($event)">
</app-code-section>
