<div class="code-section">

  <code-editor
    class="editor-area"
    [ngModel]="value"
    (ngModelChange)="onValueChange($event)"
    [extensions]="resolvedEditorExtensions"
    [theme]="theme">
  </code-editor>

  <div
  class="resize-bar"
  (mousedown)="resizeStart.emit($event)">
  </div>


  <div class="output-panel" [style.height.px]="terminalHeight">
    <div class="output-header">
      <span>OUTPUT</span>
      <span class="output-state">
        {{ cargando ? 'running...' : resultadoOk ? 'finished' : 'console' }}
      </span>
    </div>

    <pre class="output-body">{{ resultado || 'Run code to see output...' }}</pre>

    <div class="output-input">
      <span>&gt;</span>
      <input
        type="text"
        [(ngModel)]="entradaUsuario"
        placeholder="stdin"
        (keydown.enter)="enviarEntrada()" />
    </div>
  </div>

</div>
