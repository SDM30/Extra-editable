<div class="ide-body">
<!-- Columna Editor -->
<div class="editor-panel">
  <code-editor
    class="cm-host"
    [ngModel]="value"
    (ngModelChange)="onValueChange($event)"
    [theme]="theme"
    [extensions]="editorExtensions"
  ></code-editor>
</div>

  <!-- Columna Problema -->
  <aside class="problem-panel" [class.collapsed]="isProblemCollapsed">
    <div class="problem-header">
      <span class="problem-title">Problem</span>

      <button class="collapse-btn" type="button" (click)="toggleProblem()">
        <span class="chev" [class.rotated]="isProblemCollapsed">⮜</span>
      </button>
    </div>

    <div class="problem-content">
      <table class="problem-table">
        <!-- Tabla vacía por ahora -->
      </table>
    </div>

    <div class="output-console">
      <pre>{{ resultado }}</pre>
      <div class="console-input">
  <input
    type="text"
    [(ngModel)]="entradaUsuario"
    placeholder="Escribe una entrada y presiona Enter"
    (keydown.enter)="enviarEntrada()" />

  <button (click)="enviarEntrada()">
    Enviar
  </button>
</div>
    </div>
  </aside>
</div>
