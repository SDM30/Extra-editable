<form (ngSubmit)="onLogin()" [formGroup]="loginForm" novalidate>

  <div class="alert error" *ngIf="errorMessage">{{ errorMessage }}</div>

  <div class="field">
    <label for="username">Usuario*</label>
    <input
      id="username"
      formControlName="username"
      type="text"
      placeholder="tu_usuario"
      autocomplete="username"
    />
    <div class="error-message"
      *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
      El usuario es requerido.
    </div>
  </div>

  <div class="field">
    <label for="password">Contraseña*</label>
    <input
      id="password"
      formControlName="password"
      type="password"
      placeholder="••••••••"
      autocomplete="current-password"
    />
    <div class="error-message"
      *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
      La contraseña es requerida.
    </div>
  </div>

  <div class="actions">
    <button class="btn" type="submit" [disabled]="isLoading || loginForm.invalid">
      {{ isLoading ? 'Entrando...' : 'Entrar' }}
    </button>
    <button class="btn btn--outline" type="button" (click)="toggleForm.emit()" [disabled]="isLoading">
      Crear cuenta
    </button>
  </div>

</form>
