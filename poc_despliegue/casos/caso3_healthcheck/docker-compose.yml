services:
  # ─── Instancia 1: saludable ────────────────────────────────────────────────
  evaluacion1:
    build: ../..
    environment:
      - PORT=8081
      - VERSION=v1
      - HEALTHY=true        # Cambiar a 'false' para simular fallo
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8081/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s         # Verificar cada 10 segundos
      timeout: 5s           # Timeout de la verificación
      retries: 3            # 3 fallos consecutivos = unhealthy
      start_period: 5s      # Esperar 5s antes de empezar a verificar

  # ─── Instancia 2: saludable ────────────────────────────────────────────────
  evaluacion2:
    build: ../..
    environment:
      - PORT=8082
      - VERSION=v1
      - HEALTHY=true
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8082/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ─── Nginx: solo enruta a instancias saludables ───────────────────────────
  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      evaluacion1:
        condition: service_healthy
      evaluacion2:
        condition: service_healthy
