events {}

http {
    # ─── Split de tráfico: 90% estable, 10% canario ─────────────────────────
    upstream backend {
        server evaluacion-estable:8081 weight=9;  # versión estable
        server evaluacion-canario:8082  weight=1;  # versión nueva (canario)
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend;

            # Pasar headers para identificar a qué instancia fue la request
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
