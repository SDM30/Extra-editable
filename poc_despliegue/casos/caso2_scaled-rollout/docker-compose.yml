version: '3.8'

services:
  # ─── Versión estable (90% del tráfico) ────────────────────────────────────
  evaluacion-estable:
    build: ..
    environment:
      - PORT=8081
      - VERSION=v1-estable
    ports:
      - "8081:8081"

  # ─── Versión canario - nueva versión (10% del tráfico) ────────────────────
  evaluacion-canario:
    build: ..
    environment:
      - PORT=8082
      - VERSION=v2-canario
    ports:
      - "8082:8082"

  # ─── Nginx como balanceador con split 90/10 ───────────────────────────────
  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - evaluacion-estable
      - evaluacion-canario
