worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Upstream: Balanceador para instancias del SERVICIO DE LENGUAJE (FastAPI)
    # Cada instancia es una réplica de language-service/app/main.py corriendo en su puerto.
    # Es el Servicio de Lenguaje quien gestiona internamente qué contenedor LSP
    # corresponde a cada project_id, garantizando que cada proyecto tenga su propio
    # contenedor y que el multiplexor no sea compartido entre proyectos distintos.
    #
    # NOTA: El bloque upstream es generado automáticamente por update_nginx.py
    #       leyendo las instancias activas desde Redis. No editar manualmente.
    #
    # Para levantar múltiples instancias del servicio:
    #   Instancia 1: PORT=8135 uvicorn app.main:app --host 0.0.0.0 --port 8135
    #   Instancia 2: PORT=8136 uvicorn app.main:app --host 0.0.0.0 --port 8136
    #   Instancia 3: PORT=8137 uvicorn app.main:app --host 0.0.0.0 --port 8137
    upstream lsp_service_backend {
        # {{LSP_INSTANCES}}
    }

    server {
        listen 8085;
        server_name localhost;

        location = /health {
            proxy_pass http://host.docker.internal:9090;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3s;
            proxy_connect_timeout 3s;
        }

        # Peticiones REST al Servicio de Lenguaje (crear/eliminar/consultar contenedores LSP)
        # Ejemplo: POST /lsp/{project_id} → Servicio de Lenguaje → crea contenedor LSP
        location /lsp/ {
            proxy_pass http://lsp_service_backend;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 10s;

            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_pass_request_headers on;
        }
    }
}