worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /usr/local/etc/nginx/mime.types;
    default_type application/octet-stream;

    # Upstream: Balanceador para instancias del servicio LSP
    # Realiza round-robin entre 2-3 contenedores LSP
    # 
    # IMPORTANTE: Reemplaza host.docker.internal:PORT con los puertos reales donde corren tus instancias LSP
    # Ejemplo: si tus contenedores LSP están en:
    #   - Puerto 8001 (LSP instancia 1)
    #   - Puerto 8002 (LSP instancia 2)
    #   - Puerto 8003 (LSP instancia 3)
    # Actualiza las líneas server abajo accordingly
    upstream lsp_backend {
        server 127.0.0.1:8001 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:8002 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:8003 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 8082;
        server_name localhost;

        location = /health {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 200 '{"status":"ok","service":"lsp-load-balancer"}';
        }

        # Configuración para WebSocket y LSP
        location / {
            proxy_pass http://lsp_backend;
            
            # Headers esenciales para WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Headers para preservar información del cliente
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts para conexiones de larga duración (WebSocket)
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            
            # Pass headers del cliente
            proxy_pass_request_headers on;
        }
    }
}
