worker_processes 1;
events {
    worker_connections 1024;
}
http {

    # Upstream: Balanceador para instancias del SERVICIO DE LENGUAJE (FastAPI)
    # Cada instancia es una réplica de language-service/app/main.py corriendo en su puerto.
    # Es el Servicio de Lenguaje quien gestiona internamente qué contenedor LSP
    # corresponde a cada project_id, garantizando que cada proyecto tenga su propio
    # contenedor y que el multiplexor no sea compartido entre proyectos distintos.
    #
    # Para levantar múltiples instancias del servicio:
    #   Instancia 1: cd language-service && uvicorn app.main:app --port 8135
    #   Instancia 2: cd language-service && uvicorn app.main:app --port 8136
    #   Instancia 3: cd language-service && uvicorn app.main:app --port 8137
    upstream lsp_service_backend {
        server 127.0.0.1:8135 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:8136 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:8137 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 8082;
        server_name localhost;

        location = /health {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 200 '{"status":"ok","service":"lsp-load-balancer"}';
        }

        # Peticiones REST al Servicio de Lenguaje (crear/eliminar/consultar contenedores LSP)
        # Ejemplo: POST /lsp/{project_id} → Servicio de Lenguaje → crea contenedor LSP
        location /lsp/ {
            proxy_pass http://lsp_service_backend;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 10s;

            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_pass_request_headers on;
        }
    }
}
