---
all:
  vars:
    ansible_user: estudiante
    ansible_become: true
    ansible_become_method: sudo
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

  children:
    # ── Nodo principal (Backend + Frontend + Gateway + Collab LB) ──
    main_node:
      hosts:
        david:
          ansible_host: 10.43.98.3
          ansible_ssh_pass: "{{ vault_david_password }}"
          ansible_become_pass: "{{ vault_david_password }}"

    # ── Servicio de colaboración (3 instancias Hocuspocus) ──
    collab_servers:
      hosts:
        melissa:
          ansible_host: 10.43.100.126
          ansible_ssh_pass: "{{ vault_melissa_password }}"
          ansible_become_pass: "{{ vault_melissa_password }}"

    # ── Servicio de ejecución de código ──
    code_execution_servers:
      hosts:
        chitiva:
          ansible_host: 10.43.99.41
          ansible_ssh_pass: "{{ vault_chitiva_password }}"
          ansible_become_pass: "{{ vault_chitiva_password }}"

    # ── Nodos LSP (primario + réplica) ──
    lsp_servers:
      hosts:
        gabriel:
          ansible_host: 10.43.100.88
          ansible_ssh_pass: "{{ vault_gabriel_password }}"
          ansible_become_pass: "{{ vault_gabriel_password }}"
        simon:
          ansible_host: 10.43.99.67
          ansible_ssh_pass: "{{ vault_simon_password }}"
          ansible_become_pass: "{{ vault_simon_password }}"

    # ── Balanceador LSP ──
    lsp_balancer_servers:
      hosts:
        campos:
          ansible_host: 10.43.99.20
          ansible_ssh_pass: "{{ vault_campos_password }}"
          ansible_become_pass: "{{ vault_campos_password }}"
