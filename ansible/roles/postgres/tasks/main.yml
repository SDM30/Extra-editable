---
# Role: postgres — Instalar y configurar PostgreSQL en David (main_node)

- name: Instalar PostgreSQL y python3-psycopg2
  apt:
    name:
      - postgresql
      - postgresql-contrib
      - python3-psycopg2
    state: present
    update_cache: yes

- name: Habilitar y arrancar PostgreSQL
  systemd:
    name: postgresql
    enabled: yes
    state: started

- name: Detectar directorio de configuración de PostgreSQL
  shell: |
    set -e
    for d in /etc/postgresql/*/main; do
      [ -d "$d" ] && echo "$d" && exit 0
    done
    exit 1
  register: pg_conf_dir
  changed_when: false

- name: Configurar listen_addresses para aceptar conexiones desde la subred
  lineinfile:
    path: "{{ pg_conf_dir.stdout }}/postgresql.conf"
    regexp: '^\s*#?\s*listen_addresses\s*='
    line: "listen_addresses = 'localhost,{{ backend_host }}'"
    state: present
  notify: restart postgresql

- name: Permitir conexiones del collab service (Melissa) en pg_hba.conf
  lineinfile:
    path: "{{ pg_conf_dir.stdout }}/pg_hba.conf"
    line: "host    {{ db_name }}    {{ db_user }}    {{ collab_host }}/32    md5"
    state: present
  notify: restart postgresql

- name: Aplicar cambios de configuración de PostgreSQL ahora
  meta: flush_handlers

- name: Abrir puerto PostgreSQL en UFW desde loopback
  ufw:
    rule: allow
    port: "{{ db_port }}"
    proto: tcp
    from_ip: "127.0.0.1"

- name: Abrir puerto PostgreSQL en UFW desde el collab service (Melissa)
  ufw:
    rule: allow
    port: "{{ db_port }}"
    proto: tcp
    from_ip: "{{ collab_host }}"

- name: Terminar conexiones activas a la base de datos
  command: >
    psql -U postgres -c
    "SELECT pg_terminate_backend(pid) FROM pg_stat_activity
     WHERE datname = '{{ db_name }}' AND pid <> pg_backend_pid();"
  become_user: postgres
  changed_when: false

- name: Eliminar base de datos si existe
  postgresql_db:
    name: "{{ db_name }}"
    state: absent
  become_user: postgres

- name: Revocar privilegios del usuario antes de eliminarlo
  command: >
    psql -U postgres -c "DROP OWNED BY \"{{ db_user }}\";"
  become_user: postgres
  ignore_errors: true
  when: db_user != 'postgres'

- name: Eliminar usuario si existe
  command: >
    psql -U postgres -c "DROP USER IF EXISTS \"{{ db_user }}\";"
  become_user: postgres
  when: db_user != 'postgres'

- name: Crear usuario de base de datos
  postgresql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    state: present
  become_user: postgres

- name: Crear base de datos
  postgresql_db:
    name: "{{ db_name }}"
    owner: "{{ db_user }}"
    state: present
  become_user: postgres

- name: Aplicar esquema SQL inicial
  command: >
    psql -U postgres -d {{ db_name }}
    -f {{ project_dir }}/backend/db/esquema.sql
  become_user: postgres
