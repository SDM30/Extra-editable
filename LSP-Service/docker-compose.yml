services:
  language-service:
    build: ./language-service
    labels:
      - "lsp.service=api"
      - "lsp.component=language-service"
    ports:
      - "8135"
    environment:
      - HOST_IP=${HOST_IP:-127.0.0.1}
      - WS_PUBLIC_HOST=${HOST_IP:-127.0.0.1}
      - PROJECTS_DIR=/home/projects
      - CONTAINER_IDLE_TIMEOUT=300000
      - MAX_CLIENTS_PER_CONTAINER=4
      - REDIS_HOST=redis-lsp
      - REDIS_PORT=6379
      - REDIS_DB=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - projects_data:/home/projects
      - ./language-service:/app
    networks:
      - lsp-network
    depends_on:
      redis-lsp:
        condition: service_healthy
    restart: unless-stopped

  redis-lsp:
    image: redis:7-alpine
    container_name: redis-lsp
    ports:
      - "6379:6379"
    command: >
      redis-server
      --save ""
      --appendonly no
      --stop-writes-on-bgsave-error no
    volumes:
      - redis_data:/data
    networks:
      - lsp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  projects_data:
  redis_data:

networks:
  lsp-network:
    driver: bridge