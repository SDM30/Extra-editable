# docker-compose.yml — Servicio de Lenguaje + Agente de recuperación
#
# Redis se ejecuta como contenedor independiente (ver lsp-load-balancer/install.sh).
# Cada máquina nodo despliega UN language-service + UN agente sidecar.
# En desarrollo single-machine se usa --scale para múltiples réplicas.

services:

  # ── Servicio de Lenguaje ────────────────────────────────────────────────────
  language-service:
    build: ./language-service
    labels:
      - "lsp.service=api"
      - "lsp.component=language-service"
    ports:
      - "8135"                                # puerto dinámico con --scale
    environment:
      - PORT=${PORT:-8135}
      - REDIS_HOST=${REDIS_HOST:-127.0.0.1}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - WS_PUBLIC_HOST=${WS_PUBLIC_HOST:-127.0.0.1}
      - PROJECTS_DIR=/home/projects
      - CONTAINER_IDLE_TIMEOUT=${CONTAINER_IDLE_TIMEOUT:-300000}
      - MAX_CLIENTS_PER_CONTAINER=4
      - LSP_INTERNAL_SECRET=${LSP_INTERNAL_SECRET:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/projects:/home/projects
      - ./language-service:/app
    networks:
      - lsp-network
    restart: "no"                            # el agente sidecar controla el reinicio
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8135/lsp/"]
      interval: 10s
      timeout: 3s
      retries: 2
      start_period: 15s

  # ── Agente de recuperación (sidecar) ────────────────────────────────────────
  agent:
    build: ./agent
    environment:
      - PYTHONUNBUFFERED=1
      - LABEL=lsp.service=api
      - REDIS_HOST=${REDIS_HOST:-127.0.0.1}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - CHECK_SECS=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - lsp-network
    restart: unless-stopped                  # Docker reinicia el agente si muere
    depends_on:
      - language-service

networks:
  lsp-network:
    driver: bridge
